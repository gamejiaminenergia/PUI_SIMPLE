        - paragraph [ref=f15e65]:
          - strong [ref=f15e66]: ¿Qué muestra esta gráfica?
          - text: "Cada mes, la energía que el agente vende se consigue de dos fuentes: comprándola a través de"
          - strong [ref=f15e67]: contratos bilaterales
          - text: (barras verdes) o comprándola en la
          - strong [ref=f15e68]: bolsa de energía
          - text: (barras amarillas, donde el precio es más variable). La línea azul indica el
          - strong [ref=f15e69]: total de la demanda
          - text: . Mientras más verde y menos amarillo se vea, más protegido está el agente contra los cambios de precio de la bolsa. Entre mayor sea la cobertura por contratos, más estable y previsible es su costo.
      - generic [ref=f15e72]:
        - generic [ref=f15e74]:
          - generic [ref=f15e75]: 💰 Evolución de Precios de Contratos (CU) y Cargos PUI
          - generic [ref=f15e76]: Costo Unitario Prestación (CU), Cargo Transitorio (CRPUI) y Competitivo (CFPUI) [COP/kWh]
        - paragraph [ref=f15e77]:
          - strong [ref=f15e78]: ¿Qué muestra esta gráfica?
          - text: La línea verde (CU) es el
          - strong [ref=f15e79]: precio promedio
          - text: al que el agente compra la energía mediante sus contratos por cada kilovatio-hora. Las líneas punteadas son los
          - strong [ref=f15e80]: cargos regulatorios del PUI
          - text: "(CRPUI o CFPUI): un valor adicional que el agente debe cobrar a sus clientes por kilovatio-hora para cubrir el riesgo de impago del mecanismo. En términos sencillos: el CU es lo que cuesta comprar la energía, y los cargos PUI son el «seguro» adicional regulado que se traslada a los usuarios. Si el CU sube, sube el costo base del servicio."
      - generic [ref=f15e83]:
        - generic [ref=f15e85]:
          - generic [ref=f15e86]: 📈 Asignación PUI, Egreso Giros al CIOR vs Recaudo Efectivo
          - generic [ref=f15e87]: Impacto entre la asignación de energía PUI y el egreso regulado de caja [COP & kWh]
        - paragraph [ref=f15e88]:
          - strong [ref=f15e89]: ¿Qué muestra esta gráfica?
          - text: El
          - strong [ref=f15e90]: PUI
          - text: (Pago por Uso de Interconexión) es un mecanismo por el cual algunos comercializadores recogen dinero de sus clientes para
          - strong [ref=f15e91]: compensar a la red de transporte
          - text: por la energía que circula en zonas de difícil acceso. Las barras púrpuras son el valor de esa asignación, y las líneas muestran lo que el agente está
          - strong [ref=f15e92]: obligado a girar
          - text: al operador (rojo) frente a lo que
          - strong [ref=f15e93]: efectivamente logra recaudar
          - text: de sus clientes (verde). Cuando la línea verde está debajo de la roja, el agente recauda menos de lo que debe girar, generando un faltante de caja.
      - generic [ref=f15e96]:
        - generic [ref=f15e98]:
          - generic [ref=f15e99]: 📉 Sobrecosto Acumulado e Impacto en Flujo Neto de Caja
          - generic [ref=f15e100]: Déficit financiero acumulado por incobrabilidad del recaudo CNIOR [COP]
        - paragraph [ref=f15e101]:
          - strong [ref=f15e102]: ¿Qué muestra esta gráfica?
          - text: El
          - strong [ref=f15e103]: sobrecosto
          - text: (línea roja) es el dinero que el agente
          - strong [ref=f15e104]: no logra recuperar
          - text: de sus clientes del PUI, aunque esté obligado a girarlo al operador de red. Es dinero que sale de su caja sin que entre. La línea azul es el
          - strong [ref=f15e105]: flujo neto de caja
          - text: ": lo que recauda menos lo que debe girar. Si la línea azul está por debajo de cero (zona negativa), el agente está perdiendo dinero mes a mes por este mecanismo. El área roja sombreada indica la pérdida acumulada total."
