    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-card: #f8fafc;
            --bg-card-hover: #f1f5f9;
            --border-color: rgba(0, 0, 0, 0.1);
            --accent-blue: #3b82f6;
            --accent-teal: #14b8a6;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --accent-purple: #8b5cf6;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(239, 68, 68, 0.05) 0%, transparent 40%);
        }

        .container {
            max-width: 1900px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }

        .header-title p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .badges-group {
            display: flex;
            gap: 0.5rem;
        }

        .badge-rol {
            display: inline-block;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-cnior {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge-forecast {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.4);
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.65rem 1.25rem;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(59, 130, 246, 0.3));
            border-color: var(--accent-purple);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Parameters Panel */
        .params-panel {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.25rem;
        }

        .param-item {
            display: flex;
            flex-direction: column;
        }

        .param-item label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .param-item span {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* KPI Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .kpi-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 1.35rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .kpi-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--card-color, var(--accent-blue)), transparent);
        }

        .kpi-card.danger { --card-color: var(--accent-red); }
        .kpi-card.warning { --card-color: var(--accent-amber); }
        .kpi-card.success { --card-color: var(--accent-emerald); }
        .kpi-card.purple { --card-color: var(--accent-purple); }
        .kpi-card.teal { --card-color: var(--accent-teal); }

        .kpi-title {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            font-weight: 400;
        }

        .kpi-value {
            font-size: 1.55rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .kpi-sub {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .text-red { color: var(--accent-red) !important; }
        .text-purple { color: #c4b5fd !important; }
        .text-emerald { color: var(--accent-emerald) !important; }
        .text-amber { color: var(--accent-amber) !important; }
        .text-teal { color: var(--accent-teal) !important; }

        /* Chart Grid Layout - Full Width Single Column */
        .charts-grid-2x2 {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.75rem;
            margin-bottom: 2.5rem;
        }

        .chart-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 1.5rem;
            position: relative;
        }

        .chart-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .chart-card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chart-card-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.15rem;
        }

        .chart-explanation {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 0.75rem 0 1rem 0;
            padding: 0.75rem 1rem;
            background: rgba(59, 130, 246, 0.08);
            border-left: 3px solid var(--accent-blue);
            border-radius: 0.5rem;
        }

        .chart-explanation strong {
            color: var(--text-primary);
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 420px;
        }

        /* Formula Card & Code Box */
        .formula-box {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #a78bfa;
            line-height: 1.6;
            margin-top: 0.75rem;
            margin-bottom: 1.25rem;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .step-card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
        }

        .step-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Search & Table */
        .section-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 1.75rem;
            margin-bottom: 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .search-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            width: 320px;
        }

        .search-box:focus {
            border-color: var(--accent-blue);
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 550px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 0.85rem 1rem;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            background: #f8fafc;
            white-space: nowrap;
        }

        td {
            padding: 0.85rem 1rem;
            font-size: 0.88rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            white-space: nowrap;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.04);
        }

        .tag-hist {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            font-size: 0.7rem;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            font-weight: 600;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .tag-forecast {
            display: inline-block;
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            font-size: 0.7rem;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            font-weight: 600;
            border: 1px solid rgba(139, 92, 246, 0.4);
        }

        .tag-coverage {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            font-size: 0.72rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
